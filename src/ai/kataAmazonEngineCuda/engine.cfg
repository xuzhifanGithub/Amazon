# KataAmazon GTP 配置 - gen012 模型 + OpenCL(GPU) 版 amazons.exe，10x10
# 用法: amazons.exe gtp -config engine.cfg -model gen012_model.bin.gz
#
# 引擎/模型来自 gen012 分享包（b20c256legacyv10，20 残差块 256 通道）。
# gen012 模型是新版导出格式，CUDA 版 katago.exe 无法解析其激活层，
# 必须配合本目录内的 OpenCL 版 amazons.exe 使用。
#
# 搜索参数参考 Lizzie 原始 kataAmazon（E:\hex\lz_amzon\...\KatagoMoveStoneGames_Lizzie\engine.cfg），
# 该配置经过作者充分调优，实战表现好，不是围棋默认行为。
# 规则与训练(selfplay)一致：koRule=SIMPLE, scoring=AREA, taxRule=NONE, komi=0。

# --- 搜索 ---
# gen012 训练自博弈与正式评测均使用 600 visits。
numSearchThreads = 8
maxVisits = 600

# --- 搜索行为：对齐 Lizzie 原始 kataAmazon ------------------------------
# cpuct 探索曲线：Lizzie 作者的调参(0.9/0.6/500)，比围棋默认更稳健。
cpuctExploration = 0.9
cpuctExplorationLog = 0.6
cpuctExplorationBase = 500

# 图搜索 + 噪音剪枝：对重复局面多的亚马逊棋很重要(作者开的)。
useGraphSearch = true
useNoisePruning = true

# 策略温度：Lizzie 设为 1.1（略高于围棋 1.0），与模型训练一致。
nnPolicyTemperature = 1.1
subtreeValueBiasFactor = 0.0

# 长 PV 供人类分析（对引擎棋力无影响，只影响 info 输出长度）。
analysisPVLen = 8

# --- 神经网络（OpenCL 后端）---
numNNServerThreadsPerModel = 1
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 19
# 单张 OpenCL 显卡，默认用设备 0。若日志显示选中了核显，
# 可依次改为 1、2 直到日志显示目标独立显卡（每张卡只需调优一次）。
gpuToUseThread0 = 0
# OpenCL 调优缓存放在引擎目录内，保证项目整体复制后仍可用。
homeDataDir = KataGoData

# --- 亚马逊棋规则 ---
# 本定制引擎的亚马逊棋规则是编译期固定的，不读取围棋规则键
# （koRule/scoringRule/multiStoneSuicideLegal/hasButton/whiteHandicapBonus
#  会被报为 unused key），因此这里不再设置。
taxRule = NONE

# --- 对弈行为 ---
# 必须禁用认输：本项目把一个亚马逊棋回合编码为 3 次交替颜色的 genmove
# （b 选子 / w 移动 / b 放箭），中间那次 genmove 会让引擎以对手视角评估局面，
# 一旦该视角看起来必败，引擎就会返回 resign 而不是坐标，导致回合无法解析。
allowResignation = false
# 下面两个键即使禁用认输也必须存在，否则引擎启动时报
# "Could not find key 'resignThreshold'" 并退出。
resignThreshold = -0.95
resignConsecTurns = 3
lagBuffer = 1.0
ponderingEnabled = false

# 胜率以「当前行动方」视角报告，供 GUI 显示。
reportAnalysisWinratesAs = SIDETOMOVE

# --- 日志 ---
logDir = gtp_logs
logAllGTPCommunication = false
logSearchInfo = false
logToStderr = false
