# KataAmazon GTP 配置 - CPU(Eigen) 版引擎，10x10
# 用法: katago.exe gtp -config engine.cfg -model ../amazon18-s1699072-d2052785/model.bin.gz
#
# 规则与训练(selfplay)一致：koRule=SIMPLE, scoring=AREA, tax=NONE, 无 komi。

# --- 搜索 ---
# CPU(Eigen) 后端：用固定访问量而非时间控制来保证胜率评估质量与可控耗时。
# maxVisits=200 与训练(selfplay)一致，单次 genmove 约数秒。
numSearchThreads = 8
maxVisits = 200

# --- 搜索行为：与训练(selfplay)配置对齐 ------------------------------------
# 这些值取自该模型的 selfplay 配置，KataGo 的围棋默认值与之不同，
# 沿用默认值会让搜索偏离模型训练时的行为，表现为选着不稳、棋力下降。
cpuctExploration = 1.1
cpuctExplorationLog = 0.0
rootPolicyTemperature = 1.1
fpuReductionMax = 0.2
rootFpuReductionMax = 0.0

# 用置信下界(LCB)选着：避免只看访问量而选到胜率偏低的着法。
useLcbForSelection = true
lcbStdevs = 5.0
minVisitPropForLCB = 0.15

# 对弈时确定性落子（训练用的温度/根噪声只服务于探索，对弈必须关闭）。
chosenMoveTemperature = 0.0
chosenMoveTemperatureEarly = 0.0
rootNoiseEnabled = false

# --- 神经网络 ---
numNNServerThreadsPerModel = 1
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 18

# --- 亚马逊棋规则（与训练一致）---
koRule = SIMPLE
scoringRule = AREA
taxRule = NONE
multiStoneSuicideLegal = false
hasButton = false
whiteHandicapBonus = N

# --- 对弈行为 ---
allowResignation = true
resignThreshold = -0.95
resignConsecTurns = 3
lagBuffer = 1.0
ponderingEnabled = false

# 胜率以「当前行动方」视角报告，供 GUI 显示。
reportAnalysisWinratesAs = SIDETOMOVE

# --- 日志 ---
logDir = gtp_logs
logAllGTPCommunication = true
logSearchInfo = true
logToStderr = false
